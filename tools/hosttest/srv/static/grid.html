<!DOCTYPE html><html><head><style>
.g{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.g div{background:#36c;color:#fff;padding:6px}
.o{order:-1;background:#c33 !important}
.p{order:2;background:#3a3 !important}
</style></head><body><h3>Grid ordering</h3><div class="g">
<div>1</div><div>2</div><div class="p">3 (order 2)</div><div>4</div><div>5</div><div class="o">6 (order -1)</div><div>7</div><div>8</div><div>9</div><div>10</div><div>11</div><div>12</div><div class="o">13 (order -1)</div><div>14</div><div>15</div><div>16</div><div>17</div><div>18</div><div>19</div><div>20</div>
</div></body></html>
