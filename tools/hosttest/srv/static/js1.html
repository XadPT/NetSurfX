<!DOCTYPE html><html><head><title>JS test</title>
<style>#out div{padding:2px;margin:2px;background:#eef}.ok{color:#080}.bad{color:#c00}</style></head><body>

<script>
var out=document.getElementById('out');
function line(t,ok){var d=document.createElement('div');d.className=ok?'ok':'bad';d.textContent=t;out.appendChild(d);}
try{
 line('DOM: createElement/appendChild works',true);
 line('Math: log2(8)='+Math.log2(8)+' cbrt(27)='+Math.cbrt(27)+' acosh(1)='+Math.acosh(1)+' expm1(0)='+Math.expm1(0), Math.log2(8)===3&&Math.cbrt(27)===3);
 line('JSON: '+JSON.stringify({a:[1,2,{b:'x'}]}),true);
 line('RegExp: '+'2026-11-23'.replace(/(\d+)-(\d+)-(\d+)/,'$3/$2/$1'),true);
 line('parseFloat: '+parseFloat('3.25e2')+' toFixed: '+(1/3).toFixed(4),parseFloat('3.25e2')===325);
 line('Date: '+(new Date(0)).toISOString(),true);
 var a=[5,3,9,1].sort(function(x,y){return x-y});line('sort: '+a.join(','),a.join()==='1,3,5,9');
 document.getElementById('h').textContent='JavaScript test (scripts ran)';
 setTimeout(function(){line('setTimeout fired',true);},300);

</script></body></html>
